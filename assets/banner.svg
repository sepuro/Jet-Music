<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1E1E28" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0C0C10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161B"/>
      <stop offset="100%" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="specBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Main Banner Canvas -->
  <rect width="1200" height="420" rx="28" fill="url(#ambientGlow)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Official App Icon Squircle on Left-Center -->
  <g transform="translate(600, 128)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#cardSurface)" stroke="url(#specBorder)" stroke-width="1.5"/>
    <g scale="42" transform="scale(42)">
      <circle cx="0" cy="0" r="0.64" fill="none" stroke="#F5F5F7" stroke-width="0.064"/>
      <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#F5F5F7" stroke-width="0.084" stroke-linecap="round"/>
      <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="0.036" stroke-linejoin="round"/>
      <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="0.030" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography: Jet Music -->
  <text x="600" y="242" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6">Jet Music</text>
  <text x="600" y="282" text-anchor="middle" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="20" font-weight="500" letter-spacing="-0.3">Audio sin pérdidas • Music Flow • Interfaz Apple Glass a 120Hz • 100% Open Source</text>

  <!-- Floating Capsule Badges -->
  <g transform="translate(600, 342)">
    <rect x="-290" y="-20" width="176" height="40" rx="20" fill="#121216" stroke="url(#pillBorder)" stroke-width="1"/>
    <text x="-202" y="5" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="13" font-weight="600">Lossless &amp; Atmos</text>

    <rect x="-98" y="-20" width="196" height="40" rx="20" fill="#121216" stroke="url(#pillBorder)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="13" font-weight="600">Apple Glass • 120 FPS</text>

    <rect x="114" y="-20" width="176" height="40" rx="20" fill="#121216" stroke="url(#pillBorder)" stroke-width="1"/>
    <text x="202" y="5" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="13" font-weight="600">jetmusic.site</text>
  </g>
</svg>
