<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Jet Music — Music that moves you. No ads. No limits.</title>

  <!-- SEO & Brand Metadata -->
  <meta name="title" content="Jet Music — Music that moves you. No ads. No limits." />
  <meta name="description" content="Jet Music is a free music streaming app for Android with ad-free playback, synced lyrics, Music Flow, and a pure minimalist experience." />
  <meta name="author" content="Jet Music" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="canonical" href="https://jetmusic.site/" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jetmusic.site/" />
  <meta property="og:title" content="Jet Music — Music that moves you. No ads. No limits." />
  <meta property="og:description" content="Jet Music is a free music streaming app for Android with ad-free playback, synced lyrics, Music Flow, and a pure minimalist experience." />
  <meta property="og:image" content="https://jetmusic.site/og-image.png" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://jetmusic.site/" />
  <meta name="twitter:title" content="Jet Music — Music that moves you. No ads. No limits." />
  <meta name="twitter:description" content="Jet Music is a free music streaming app for Android with ad-free playback, synced lyrics, Music Flow, and a pure minimalist experience." />
  <meta name="twitter:image" content="https://jetmusic.site/og-image.png" />

  <!-- Favicons & Web App Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Geometric Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      background: linear-gradient(0deg, #D9232E 0%, #F46068 32%, #FDE8E9 65%, #FFFFFF 100%);
      color: #111113;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #111113;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      flex-shrink: 0;
    }

    .logo-wrapper svg {
      width: 96px;
      height: 96px;
      display: block;
    }

    h1 {
      font-size: clamp(2rem, 7.5vw, 2.5rem);
      font-weight: 800;
      color: #111113;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin-bottom: 16px;
    }

    p.description {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.55;
      color: #3A3A3C;
      margin-bottom: 32px;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-primary {
      width: 100%;
      height: 56px;
      border-radius: 9999px;
      background: #111113;
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(17, 17, 19, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(17, 17, 19, 0.28);
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .btn-secondary {
      margin-top: 14px;
      width: 100%;
      height: 54px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #111113;
      font-size: 0.96875rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: transform 0.18s ease, background 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.96);
      transform: translateY(-1px);
    }

    .btn-secondary:active {
      transform: scale(0.985);
    }

    .github-avatar-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2.5px solid #111113;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: block;
      background: #111113;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .github-avatar-fab:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
    }

    .github-avatar-fab:active {
      transform: scale(0.95);
    }

    .github-avatar-fab img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
  </style>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1460228543841383"
     crossorigin="anonymous"></script>
</head>
<body>
  <main class="container">
    <!-- 1. Official Jet Music Circular Dark Logo (96x96) -->
    <div class="logo-wrapper" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="96" height="96">
        <circle cx="256" cy="256" r="256" fill="#111113" />
        <g transform="translate(256, 256) scale(210)">
          <circle cx="0" cy="0" r="0.64" fill="none" stroke="#FFFFFF" stroke-width="0.064" />
          <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#FFFFFF" stroke-width="0.084" stroke-linecap="round" />
          <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.036" stroke-linejoin="round" />
          <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.030" stroke-linejoin="round" />
        </g>
      </svg>
    </div>

    <!-- 2. Minimalist Title & Description -->
    <h1>Music that moves you.<br>No ads. No limits.</h1>
    <p class="description">
      Jet Music is a free music streaming app for Android with ad-free playback, synced lyrics, Music Flow, and a pure minimalist experience.
    </p>

    <!-- 3. Two Capsule Buttons Only -->
    <div class="actions">
      <a
        id="download-apk-btn"
        class="btn-primary"
        href="https://github.com/sepuro/Jet-Music/releases/latest"
        rel="noopener"
      >
        Download APK
      </a>

      <a
        class="btn-secondary"
        href="https://github.com/sepuro/Jet-Music"
        target="_blank"
        rel="noopener noreferrer"
      >
        View Source Code
      </a>
    </div>
  </main>

  <!-- 4. Floating Bottom-Right GitHub Profile Avatar -->
  <a
    class="github-avatar-fab"
    href="https://github.com/sepuro/Jet-Music"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open Jet Music on GitHub"
  >
    <img src="https://github.com/sepuro.png" alt="sepuro GitHub Profile" loading="eager" />
  </a>

  <script>
    (function () {
      const FALLBACK_URL = 'https://github.com/sepuro/Jet-Music/releases/latest';
      const API_URL = 'https://api.github.com/repos/sepuro/Jet-Music/releases/latest';
      const downloadBtn = document.getElementById('download-apk-btn');
      let resolvedApkUrl = null;

      async function resolveLatestApk() {
        try {
          const response = await fetch(API_URL, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) return null;
          const release = await response.json();
          const assets = Array.isArray(release.assets) ? release.assets : [];
          const apkAsset = assets.find(function (asset) {
            return asset && typeof asset.browser_download_url === 'string' && asset.browser_download_url.toLowerCase().endsWith('.apk');
          });
          if (apkAsset && apkAsset.browser_download_url) {
            resolvedApkUrl = apkAsset.browser_download_url;
            if (downloadBtn) {
              downloadBtn.href = resolvedApkUrl;
            }
            return resolvedApkUrl;
          }
        } catch (_) {}
        return null;
      }

      resolveLatestApk();

      if (downloadBtn) {
        downloadBtn.addEventListener('click', async function (event) {
          if (resolvedApkUrl) {
            return;
          }
          event.preventDefault();
          const apkUrl = await resolveLatestApk();
          window.location.href = apkUrl || FALLBACK_URL;
        });
      }
    })();
  </script>
</body>
</html>
