name: Deploy Jet Music Official Website (jetmusic.site)

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "CNAME"
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify & Publish jetmusic.site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify CNAME and Web Assets
        run: |
          test -f docs/CNAME
          grep -qx "jetmusic.site" docs/CNAME
          test -f docs/index.html
          test -f docs/favicon.svg
          test -f docs/apple-touch-icon.png
          test -f docs/og-image.png

      - name: Publish docs/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DOCS_TREE=$(git rev-parse HEAD:docs)
          COMMIT_HASH=$(git commit-tree "$DOCS_TREE" -m "deploy(web): publish jetmusic.site from main (${GITHUB_SHA::7})")
          git push origin "$COMMIT_HASH:refs/heads/gh-pages" --force
