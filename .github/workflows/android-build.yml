name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Jet Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        elif [ ! -f "keystore.jks" ]; then
          keytool -genkeypair \
            -keystore keystore.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Jet Music Release,O=Jet Music,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
        fi

    - name: Build Signed Release APK (R8 Full Mode)
      env:
        KEYSTORE_FILE: keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || (secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android') }}
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || (secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android') }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'androiddebugkey' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'android' }}
      run: |
        chmod +x gradlew
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        ./gradlew assembleUniversalFossRelease
        mkdir -p release-assets
        cp app/build/outputs/apk/universalFoss/release/*.apk "release-assets/Jet-Music-v${VERSION}-release.apk"

    - name: Upload Jet Music Release APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Jet-Music-Release-APK
        path: |
          release-assets/*.apk

    - name: Publish GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        TAG="v${VERSION}"
        TITLE="Jet Music v${VERSION} — Apple Music UI Polish, OTA Popup & Full R8 Release"
        NOTES="## Jet Music v${VERSION}

        ### Novedades y Optimizaciones de esta Versión
        - **Refinamiento Visual Estilo Apple Music (120 FPS)**: Carátula reactiva con físicas de resorte (\`scale 1.0f / 0.85f\` y sombra dinámica \`24.dp / 8.dp\` en \`graphicsLayer\`), fondo atmosférico pre-cacheado con \`animateColorAsState\` + \`drawWithCache\`, acabado cristalino biselado Apple Glass (\`0.8.dp\` borde especular vertical) en \`MiniPlayer\` y \`BottomBar\`, y jerarquía tipográfica San Francisco Display (\`letterSpacing = (-0.5).sp\`) con resaltado de letras activas (\`scale = 1.03f\`, \`alpha = 1f\` vs \`0.35f\`).
        - **Limpieza Total de Identidad (Jet Music)**: Eliminadas todas las tarjetas, enlaces, créditos y referencias residuales de autores anteriores en \`AboutScreen\`, \`WelcomeDialog\` y recursos multi-idioma (\`strings.xml\`), dejando únicamente los enlaces oficiales de **Jet Music**.
        - **Sistema OTA con Aviso Emergente Instantáneo**: Verificación automática al iniciar y manual en Ajustes con comparador semántico estricto (\`major.minor.patch\`), diálogo emergente inmediato (*\"Nueva actualización disponible (v${VERSION})\"*) con notas de versión y botón **\"Actualizar ahora\"** con progreso real e instalación directa vía \`FileProvider\`.
        - **Compilación 100% Release (R8 / ProGuard + Shrink Resources)**: Distribución exclusivamente en modo \`release\` firmado y optimizado con reglas \`@Keep\` reforzadas para \`InnerTube\`, \`NewPipe\`, \`Media3\`, \`Ktor\`, \`Retrofit\`, \`Gson\` y \`Kotlinx Serialization\`."

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
        else
          gh release create "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
        fi
