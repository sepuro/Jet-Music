name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Jet Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Signed Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease

    - name: Build Jet Music Debug APK
      run: |
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000
        fi
        chmod +x gradlew
        ./gradlew assembleUniversalFossDebug
        mkdir -p release-assets
        cp app/build/outputs/apk/universalFoss/debug/*.apk release-assets/Jet-Music-v1.5.0-universal.apk

    - name: Upload Jet Music Universal APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Jet-Music-Universal-APK
        path: |
          app/build/outputs/apk/**/*.apk
          release-assets/*.apk

    - name: Publish GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v1.5.0"
        TITLE="Jet Music v1.5.0 — 120fps Scroll, Music Flow Video & Native OTA Updater"
        NOTES="## Jet Music v1.5.0

        ### Runtime Architecture & Performance Fixes
        - **120fps Scroll & Compose Jank Elimination**: Removed unbounded \`.basicMarquee()\` animations from list/grid items (\`Items.kt\`, \`NewMenuComponents.kt\`, \`YouTubeSongMenu.kt\`, \`MusicFlowPage.kt\`, \`Queue.kt\`, \`Thumbnail.kt\`), keeping marquee exclusively in \`MiniPlayer\` and expanded \`Player\`. Added stable \`key\` and \`contentType\` across \`HomeScreen\`, \`PodcastHome\`, and \`ContinueListening\`. Moved floating capsule translations and rotations to draw-phase \`Modifier.graphicsLayer\`, guarded zero-radius \`BlurEffect\`, paused idle infinite animations, and enforced fixed image dimensions with \`CachePolicy.ENABLED\` in Coil.
        - **Music Flow Video Surface Rendering (Media3 / ExoPlayer)**: Enabled animated canvas background by default in \`MusicFlowPreferences\`, removed \`downloadCache\` write contention on \`CanvasArtworkPlayer\` viaread-only cache sink, exposed \`onVideoReadyChanged\` to fade out static cover art (\`alpha = 0f\`) when video frames render, added \`YouTubeVideoCanvasProvider\` fallback + disk caching in \`AmbientCanvasBackground\`, cleared \`TextureView\` surface cleanly on dispose, and synchronized \`MusicFlowViewModel.enter()\` with the active \`nowPlaying\` track.
        - **Native GitHub OTA Updater & In-App APK Installer**: Connected updater directly to \`https://api.github.com/repos/sepuro/Jet-Music/releases/latest\`, implemented strict numeric SemVer comparison (\`remote > local\`), bumped \`versionName\` to \`1.5.0\` (\`versionCode = 168\`), removed legacy external ad-redirect prompts, and implemented direct in-app APK download with progress reporting and native \`FileProvider\` package installation."

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" release-assets/*.apk --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
        else
          gh release create "$TAG" release-assets/*.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
        fi
