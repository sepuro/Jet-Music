name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CNAME"
      - "index.html"
      - "favicon.svg"
      - "icon.svg"
      - "logo-mark.svg"
      - "apple-touch-icon.png"
      - "og-image.png"
      - "site.webmanifest"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - "vercel.json"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Jet Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -f "app/keystore.jks" ]; then
          cp app/keystore.jks keystore.jks
        elif [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cp keystore.jks app/keystore.jks
        elif [ -f "app/persistent-debug.keystore" ]; then
          cp app/persistent-debug.keystore keystore.jks
          cp keystore.jks app/keystore.jks
        else
          echo "ERROR: Official keystore (app/keystore.jks) not found!"
          exit 1
        fi
        keytool -list -v -keystore app/keystore.jks -storepass android | grep -i "AC:B5:50:5E:B0:57:21:E4:E2:C8:42:B3:D3:DD:D0:40:DF:99:86:F9:9C:4E:A9:5A:16:D0:CC:C9:EC:A7:C7:AF"

    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest

    - name: Build Signed Release APK (R8 Full Mode + Lint Vital)
      env:
        KEYSTORE_FILE: app/keystore.jks
        KEYSTORE_PASSWORD: android
        STORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android
      run: |
        chmod +x gradlew
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        ./gradlew lintVitalUniversalFossRelease assembleUniversalFossRelease --stacktrace
        mkdir -p release-assets
        SIGNED_APK=$(find app/build/outputs/apk/universalFoss/release -maxdepth 1 -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
        if [ -z "$SIGNED_APK" ]; then
          echo "ERROR: Signed release APK not found!"
          exit 1
        fi
        cp "$SIGNED_APK" "release-assets/Jet-Music-v${VERSION}-release.apk"

    - name: Verify APK Signature (v2/v3) & Badging (apksigner & aapt2)
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        APK_PATH="release-assets/Jet-Music-v${VERSION}-release.apk"
        ls -lh "$APK_PATH"
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        echo "Using build-tools from: $BUILD_TOOLS_DIR"
        "$BUILD_TOOLS_DIR/apksigner" sign \
          --ks app/keystore.jks \
          --ks-pass pass:android \
          --ks-key-alias androiddebugkey \
          --key-pass pass:android \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          "$APK_PATH"
        "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH" | tee apksigner_output.txt
        grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner_output.txt
        grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner_output.txt
        grep -qi "acb5505eb05721e4e2c842b3d3ddd040df9986f99c4ea95a16d0ccc9eca7c7af" apksigner_output.txt
        VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -1 | awk '{print $3}')
        "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | grep -E "package:|launchable-activity:" | tee badging_output.txt
        grep -q "name='app.jetmusic.android'" badging_output.txt
        grep -q "versionCode='${VERSION_CODE}'" badging_output.txt
        grep -q "versionName='${VERSION}'" badging_output.txt

    - name: Upload Jet Music Release APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Jet-Music-Release-APK
        path: |
          release-assets/*.apk

    - name: Publish GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -1 | awk '{print $3}')
        TAG="v${VERSION}"
        TITLE="Jet Music v${VERSION} — Seamless TextureView + BlendMode.DstIn Alpha Fade on Player Video & Canvas"
        NOTES="## Jet Music v${VERSION}

        ### Novedades de esta versión
        - **Difuminado Alfa Real sin Costuras en Video del Reproductor (\`TextureView\` + \`BlendMode.DstIn\`)**: Migración del renderizador de video/canvas del reproductor (\`CanvasArtworkPlayer\` y \`BackgroundVideoView\`) de \`SurfaceView\` a \`TextureView\` integrado en el pipeline \`RenderNode\` de Jetpack Compose (\`CompositingStrategy.Offscreen\` + \`BlendMode.DstIn\` multi-parada y \`isVerticalFadingEdgeEnabled = true\`), eliminando el corte horizontal recto encima del \`Slider\` y manteniendo 1080p+ de alto bitrate (\`RESIZE_MODE_ZOOM\`).
        - **Sincronización Absoluta de Music Flow (\`Single Source of Truth\`)**: \`VerticalPager\` conectado directamente a la cola activa real de \`ExoPlayer\` (\`queueWindows\` / \`currentMediaItemIndex\`). Cero reinicio o cambio de pista al entrar; las recomendaciones adicionales se añaden exclusivamente al final de la cola con \`player.addMediaItems(...)\`.
        - **Máxima Calidad de Video (1080p+ / Full HD / Alto Bitrate)**: Selección prioritaria de streams adaptativos \`height >= 1080\`, 60fps y códecs modernos (\`av01\` / \`vp9\` / \`avc1\`) en InnerTube y NewPipe, \`DefaultTrackSelector\` forzado al máximo bitrate sincronizado con \`mainPlayer\`.
        - **Tarjeta de Instagram en Sobre (\`AboutScreen\`)**: Tarjeta integrada de Instagram (\`instagram.com/amalejandroo\`) junto a GitHub y Website en el bloque de **Jet Music**.
        - **Actualización OTA In-Place (\`versionCode = ${VERSION_CODE}\`)**: Firmado con el certificado oficial único (\`v1\`/\`v2\`/\`v3\`) para actualización directa vía OTA."

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
        else
          gh release create "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
        fi
