name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Jet Music APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Prepare Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        elif [ -f "app/persistent-debug.keystore" ]; then
          cp app/persistent-debug.keystore keystore.jks
        else
          keytool -genkeypair \
            -keystore keystore.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Jet Music Release,O=Jet Music,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
        fi

    - name: Run Unit Tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest :app:testUniversalFossDebugUnitTest

    - name: Build Signed Release APK (R8 Full Mode + Lint Vital)
      env:
        KEYSTORE_FILE: keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || (secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android') }}
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || (secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android') }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'androiddebugkey' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'android' }}
      run: |
        chmod +x gradlew
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        ./gradlew lintVitalUniversalFossRelease assembleUniversalFossRelease --stacktrace
        mkdir -p release-assets
        cp app/build/outputs/apk/universalFoss/release/*.apk "release-assets/Jet-Music-v${VERSION}-release.apk"

    - name: Verify APK Signature (v2/v3) & Badging (apksigner & aapt2)
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        APK_PATH="release-assets/Jet-Music-v${VERSION}-release.apk"
        ls -lh "$APK_PATH"
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        echo "Using build-tools from: $BUILD_TOOLS_DIR"
        "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH" | tee apksigner_output.txt
        grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner_output.txt
        grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner_output.txt
        "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | grep -E "package:|launchable-activity:" | tee badging_output.txt
        grep -q "name='app.jetmusic.android'" badging_output.txt

    - name: Upload Jet Music Release APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Jet-Music-Release-APK
        path: |
          release-assets/*.apk

    - name: Publish GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        TAG="v${VERSION}"
        TITLE="Jet Music v${VERSION} — Clean Package ID, v2/v3 Signed APK & Optimized Size"
        NOTES="## Jet Music v${VERSION}

        ### Novedades y Correcciones Críticas de Empaquetado e Instalación
        - **Identificador de Paquete Exclusivo (\`app.jetmusic.android\`)**: Eliminado cualquier conflicto con instalaciones residuales (\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\` / \`INSTALL_FAILED_CONFLICTING_PROVIDER\`) y unificadas todas las authorities dinámicas (\`\${applicationId}.fileprovider\`, \`\${applicationId}.artwork\`, \`\${applicationId}.com.dpi.DensityScaler\`).
        - **Firma Criptográfica Nativa Persistente (v1 + v2 + v3)**: Habilitados explícitamente \`enableV1Signing\`, \`enableV2Signing\` y \`enableV3Signing\` con keystore persistente y verificación estricta en CI mediante \`apksigner verify --verbose --print-certs\` y \`aapt2 dump badging\`.
        - **Optimización de Tamaño Nativo (ARM64 + ARMv7)**: Filtrados los binarios de emulador (\`x86\`, \`x86_64\`) para reducir drásticamente el peso del APK manteniendo \`extractNativeLibs=\"true\"\` y \`useLegacyPackaging = true\`.
        - **Blindaje R8 / ProGuard Completo**: Reglas \`-keep\` exhaustivas para todos los módulos (\`innertube\`, \`innertubex\`, \`media3\`, \`ktor\`, \`gson\`, \`retrofit2\`, \`kotlinx.serialization\`, \`dsp\`, \`usbaudio\`, \`canvas\`, \`lyrics\`)."

        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
        else
          gh release create "$TAG" "release-assets/Jet-Music-v${VERSION}-release.apk" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
        fi
