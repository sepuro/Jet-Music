<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jet Music — Billie Jean Motion v7 (Generador de Video Promocional 1080p 60fps)</title>
  
  <!-- Tipografías de alta fidelidad: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet" />

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --jet-red: #D9232E;
      --jet-red-glow: rgba(217, 35, 46, 0.65);
      --jet-red-soft: rgba(217, 35, 46, 0.16);
      --bg-pitch: #050507;
      --bg-surface: #0E0E12;
      --pink-neon: #FF66B2;
      --pink-hot: #FF4D8D;
      --purple-start: #A855F7;
      --purple-end: #7E22CE;
      --stage-w: 1920px;
      --stage-h: 1080px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor viewport que escala el lienzo 1920x1080 manteniendo relación 16:9 exacta */
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #020203;
    }

    #stage-scaler {
      position: absolute;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      box-shadow: 0 0 120px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      background: var(--bg-pitch);
    }

    /* Lienzo Maestro 1920x1080 */
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #050507;
      overflow: hidden;
      perspective: 900px;
      perspective-origin: 50% 50%;
    }

    .film-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 98;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
    }

    /* ========================================================
       ESCENA 1: PISO 3D DE BALDOSAS ("BILLIE JEAN FLOOR")
       ======================================================== */
    #scene-1-floor {
      position: absolute;
      inset: -400px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      transform-origin: 50% 55%;
      will-change: transform, opacity;
      z-index: 10;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(7, 240px);
      grid-template-rows: repeat(7, 240px);
      gap: 22px;
      padding: 40px;
      transform-style: preserve-3d;
    }

    .tile {
      width: 240px;
      height: 240px;
      background: #111115;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: background 0.05s ease, box-shadow 0.05s ease;
      position: relative;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 70%);
      pointer-events: none;
    }

    .tile.lit-center {
      background: #FF66B2 !important;
      border-color: #FFFFFF !important;
      box-shadow: 
        0 0 100px #FF66B2,
        0 0 180px rgba(255, 102, 178, 0.8),
        inset 0 0 40px #FFFFFF !important;
    }

    .tile.lit-adjacent {
      background: #FF66B2 !important;
      border-color: #FFFFFF !important;
      box-shadow: 
        0 0 100px #FF66B2,
        0 0 180px rgba(255, 102, 178, 0.8),
        inset 0 0 40px #FFFFFF !important;
    }

    .floor-ambient-glow {
      position: absolute;
      width: 1400px;
      height: 1400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 102, 178, 0.28) 0%, rgba(217, 35, 46, 0.15) 35%, transparent 70%);
      transform: translateZ(-20px);
      pointer-events: none;
      opacity: 0;
    }

    /* ========================================================
       ESCENA 2 & 3: REVELACIÓN Y MINI-WIDGET DE JET MUSIC
       ======================================================== */
    #widget-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #energy-burst-circle {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #D9232E 0%, #850E15 70%, #000000 100%);
      box-shadow: 0 0 110px #D9232E, 0 0 200px rgba(217, 35, 46, 0.8);
      border: 3px solid #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0);
      z-index: 25;
    }

    #jet-card {
      position: relative;
      width: 340px;
      height: 340px;
      border-radius: 44px;
      background: radial-gradient(circle at 30% 30%, #2C2C34, #121216);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 
        0 35px 80px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(217, 35, 46, 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.6);
      will-change: width, height, transform, border-radius, opacity;
      transform-style: preserve-3d;
    }

    #jet-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(217,35,46,0.3) 50%, rgba(255,255,255,0.05) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    #mini-widget-content {
      position: absolute;
      inset: 0;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
    }

    .mini-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .mini-album-art {
      width: 92px;
      height: 92px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.12);
      flex-shrink: 0;
      position: relative;
      background: #18181D;
    }

    .mini-album-art svg, .mini-album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-badge-btn {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(217, 35, 46, 0.15);
      border: 1px solid rgba(217, 35, 46, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(217, 35, 46, 0.35);
    }

    .mini-badge-btn .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid rgba(217, 35, 46, 0.7);
      animation: pulseWave 2s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .mini-badge-btn .pulse-ring:nth-child(2) {
      inset: -14px;
      animation-delay: 0.6s;
      border-color: rgba(217, 35, 46, 0.35);
    }

    @keyframes pulseWave {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .mini-info-row {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .song-title-display {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .artist-name-display {
      font-size: 18px;
      font-weight: 500;
      color: #A0A0AB;
    }

    .mini-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
      margin-bottom: 6px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .ctrl-btn.play-pause-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #FFFFFF;
      color: #121216;
      opacity: 1;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.3);
      position: relative;
    }

    .play-pause-circle svg {
      width: 22px;
      height: 22px;
      fill: #121216;
    }

    .click-ripple {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }

    /* ========================================================
       ESCENA 4: EXPANSIÓN A "MUSIC FLOW" CON VIDEO DE FONDO
       ======================================================== */
    #flow-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }

    #flow-canvas-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #custom-video-flow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    .flow-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 14, 0.95) 0%, rgba(10, 10, 14, 0.5) 45%, rgba(10, 10, 14, 0.1) 80%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .flow-top-bar {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 34px;
    }

    .flow-brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(20, 20, 26, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .flow-brand-tag .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--jet-red);
      box-shadow: 0 0 8px var(--jet-red);
    }

    .flow-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--jet-red);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 22px rgba(217, 35, 46, 0.5);
    }

    .flow-badge-pill svg {
      width: 18px;
      height: 18px;
    }

    .flow-bottom-section {
      position: relative;
      z-index: 5;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .flow-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .flow-song-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #FFFFFF;
    }

    .flow-artist-title {
      font-size: 20px;
      font-weight: 600;
      color: #D1D1DB;
      margin-top: 4px;
    }

    .flow-progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flow-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .flow-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFFFFF, var(--jet-red));
      box-shadow: 0 0 12px var(--jet-red);
      border-radius: 999px;
    }

    .flow-time-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      font-variant-numeric: tabular-nums;
    }

    /* ========================================================
       ESCENA 5: TARJETA 3D DE LETRAS SINCRONIZADAS ("LYRICS")
       ======================================================== */
    #lyrics-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 760px;
      height: 440px;
      border-radius: 40px;
      background: linear-gradient(135deg, var(--purple-start) 0%, var(--purple-end) 100%);
      box-shadow: 
        0 35px 90px rgba(126, 34, 206, 0.55),
        0 0 60px rgba(168, 85, 247, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%) rotateY(-14deg) rotateX(6deg) scale(0.7);
      transform-style: preserve-3d;
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 46px;
      z-index: 30;
      overflow: hidden;
      will-change: transform, opacity, filter;
    }

    .lyrics-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .lyrics-label {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      background: rgba(255, 255, 255, 0.18);
      padding: 8px 22px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .lyrics-capsule {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .lyrics-capsule svg {
      width: 20px;
      height: 20px;
      fill: #FFFFFF;
    }

    .lyrics-word-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      pointer-events: none;
    }

    .lyric-girl-word {
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      text-transform: lowercase;
      transform: scale(0.2);
      opacity: 0;
      position: relative;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.3));
    }

    .lyric-girl-word::before,
    .lyric-girl-word::after {
      content: 'girl';
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .lyric-girl-word.chromatic::before {
      color: #00FFFF;
      transform: translate(-3px, -2px);
      opacity: 0.7;
    }
    .lyric-girl-word.chromatic::after {
      color: #FF0055;
      transform: translate(3px, 2px);
      opacity: 0.7;
    }

    /* ========================================================
       ESCENA 6: TIPOGRAFÍA CINÉTICA A PANTALLA COMPLETA
       ======================================================== */
    #kinetic-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 140px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at 60% 40%, rgba(20,20,30,0.92), #050507 90%);
      overflow: hidden;
    }

    /* Video de fondo para Escena 6 (opcional) */
    #kinetic-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      filter: grayscale(100%) contrast(120%);
      z-index: 1;
      display: none;
    }

    .kinetic-lines-box {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .kinetic-line {
      font-size: 96px;
      font-weight: 900;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      line-height: 1.05;
      display: flex;
      align-items: baseline;
      gap: 28px;
      will-change: transform, opacity;
      transform-origin: left center;
    }

    .kinetic-line-1 {
      opacity: 0;
      transform: translateX(-80px);
    }

    .kinetic-line-2 {
      opacity: 0;
      transform: translateX(-80px);
    }

    .kinetic-line-3 {
      opacity: 0;
      transform: translateX(-80px);
    }

    .kinetic-one-serif {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
      font-size: 112px;
      color: var(--pink-hot);
      text-transform: lowercase;
      letter-spacing: 0.02em;
      text-shadow: 
        0 0 30px var(--pink-hot),
        0 0 70px var(--pink-hot),
        0 0 120px rgba(255, 77, 141, 0.6);
      display: inline-block;
      transform: scale(0.2) rotate(-6deg);
      opacity: 0;
      will-change: transform, opacity, text-shadow;
    }

    /* ========================================================
       ESCENA 7: BURBUJA POP "OH BABY"
       ======================================================== */
    #speech-bubble-scene {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050507;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
    }

    .bubble-wrapper {
      position: relative;
      transform: scale(0) rotate(-6deg);
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .pop-bubble {
      background: var(--pink-hot);
      color: #FFFFFF;
      padding: 34px 74px;
      border-radius: 999px;
      font-size: 74px;
      font-weight: 900;
      letter-spacing: -0.03em;
      box-shadow: 
        0 25px 60px rgba(255, 77, 141, 0.55),
        0 0 80px rgba(255, 77, 141, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.5);
      position: relative;
      white-space: nowrap;
    }

    .bubble-tail {
      position: absolute;
      bottom: -18px;
      left: 64px;
      width: 0;
      height: 0;
      border-top: 26px solid var(--pink-hot);
      border-right: 28px solid transparent;
      border-left: 8px solid transparent;
      filter: drop-shadow(0 10px 15px rgba(255, 77, 141, 0.4));
    }

    /* ========================================================
       ESCENA 8: CARÁTULA A WIDGET FINAL (LOOP CERRADO)
       ======================================================== */
    #final-loop-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      perspective: 900px;
    }

    #hero-album-cover {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transform: scale(0.4);
      opacity: 0;
      z-index: 65;
      will-change: transform, width, height, border-radius, top, left, opacity;
      background: #111116;
    }

    #hero-album-cover svg, #hero-album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #loop-widget-card {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 44px;
      background: radial-gradient(circle at 30% 30%, #2C2C34, #121216);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 
        0 35px 80px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(217, 35, 46, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.9);
      z-index: 62;
    }

    /* ========================================================
       BARRA FLOTANTE DE CONTROL Y PERSONALIZACIÓN DE ESTUDIO
       ======================================================== */
    #studio-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(1360px, 96vw);
      background: rgba(14, 14, 18, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 14px 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      transition: opacity 0.3s cubic-bezier(0.2, 0.9, 0.2, 1), transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    #studio-controls.hidden-ui {
      opacity: 0;
      transform: translate(-50%, 80px);
      pointer-events: none;
    }

    /* Drawer de personalización de canción/artista/video */
    #customizer-drawer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .input-field-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .studio-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
      width: 150px;
    }

    .studio-input:focus {
      border-color: var(--jet-red);
      background: rgba(217, 35, 46, 0.12);
    }

    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: #8E8E9A;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Scrubber de línea de tiempo */
    .scrubber-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-badge {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #A0A0AB;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }

    .time-badge.active-time {
      color: #FFFFFF;
      border-color: var(--jet-red);
    }

    .timeline-range {
      flex: 1;
      height: 7px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    .timeline-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--jet-red);
      box-shadow: 0 0 10px var(--jet-red);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .timeline-range::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    /* Fila de controles y botones */
    .controls-main-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .action-btn.primary {
      background: var(--jet-red);
      border-color: var(--jet-red);
      box-shadow: 0 4px 15px rgba(217, 35, 46, 0.45);
    }

    .action-btn.primary:hover {
      background: #EE2B38;
      box-shadow: 0 6px 20px rgba(217, 35, 46, 0.65);
    }

    .action-btn.active {
      background: rgba(255, 255, 255, 0.22);
      border-color: #FFFFFF;
    }

    .action-btn.clean-btn {
      background: linear-gradient(135deg, #2A2A36, #1A1A22);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .scene-pill-group {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      max-width: 500px;
      padding-bottom: 2px;
    }

    .scene-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #B2B2BC;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .scene-pill:hover, .scene-pill.current {
      background: var(--jet-red-soft);
      border-color: var(--jet-red);
      color: #FFFFFF;
    }

    /* Modal / Banner de grabación activa */
    #recorder-banner {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(18, 18, 24, 0.94);
      border: 1px solid var(--jet-red);
      box-shadow: 0 10px 40px rgba(217, 35, 46, 0.4);
      border-radius: 999px;
      padding: 10px 24px;
      display: none;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .record-indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--jet-red);
      animation: recordBlink 1s infinite;
    }

    @keyframes recordBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Botón flotante para restaurar/ocultar UI (Tecla H) */
    #ui-toggle-float {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1001;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 20, 26, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }

    #ui-toggle-float:hover {
      background: rgba(217, 35, 46, 0.85);
      border-color: var(--jet-red);
    }

    .hidden-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div id="viewport">
    <div id="stage-scaler">
      <div id="stage">
        
        <!-- Overlays Cinematográficos -->
        <div class="film-grain"></div>
        <div class="vignette-overlay"></div>

        <!-- ========================================================
             ESCENA 1: PISO 3D DE BALDOSAS ("BILLIE JEAN FLOOR")
             ======================================================== -->
        <div id="scene-1-floor">
          <div class="floor-ambient-glow" id="floor-ambient-glow"></div>
          <div class="floor-grid" id="floor-grid">
            <!-- 49 baldosas (7x7) generadas dinámicamente -->
          </div>
        </div>

        <!-- ========================================================
             ESCENAS 2, 3 Y 4: CONTENEDOR MAESTRO DE WIDGET JET MUSIC
             ======================================================== -->
        <div id="widget-container">
          
          <!-- Círculo de destello inicial (Escena 2) -->
          <div id="energy-burst-circle">
            <svg viewBox="0 0 512 512" width="90" height="90">
              <circle cx="256" cy="256" r="230" fill="#070709" stroke="#FFFFFF" stroke-width="8"/>
              <g transform="translate(256, 256) scale(200)">
                <circle cx="0" cy="0" r="0.64" fill="none" stroke="#F5F5F7" stroke-width="0.064"/>
                <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#F5F5F7" stroke-width="0.084" stroke-linecap="round"/>
                <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="0.036" stroke-linejoin="round"/>
                <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#F5F5F7" stroke="#F5F5F7" stroke-width="0.030" stroke-linejoin="round"/>
              </g>
            </svg>
          </div>

          <!-- Tarjeta Squircle Principal de Jet Music -->
          <div id="jet-card">
            
            <!-- CONTENIDO ESCENA 3: MINI WIDGET -->
            <div id="mini-widget-content">
              
              <div class="mini-top-row">
                <div class="mini-album-art" id="mini-cover-box">
                  <svg id="default-cover-svg" viewBox="0 0 300 300" width="100%" height="100%">
                    <defs>
                      <linearGradient id="thrillerBg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1B1C22"/>
                        <stop offset="50%" stop-color="#2D2B33"/>
                        <stop offset="100%" stop-color="#0E0F12"/>
                      </linearGradient>
                      <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF"/>
                        <stop offset="100%" stop-color="#D8D8DF"/>
                      </linearGradient>
                    </defs>
                    <rect width="300" height="300" fill="url(#thrillerBg)"/>
                    <path d="M40 290 Q 70 210, 130 190 Q 150 185, 175 190 Q 240 210, 260 290 Z" fill="url(#suitGrad)" opacity="0.95"/>
                    <path d="M130 190 L 150 250 L 175 190 Z" fill="#141418"/>
                    <circle cx="152" cy="140" r="34" fill="#694838"/>
                    <circle cx="152" cy="132" r="38" fill="#0A0A0C"/>
                    <text x="150" y="58" font-family="'Playfair Display', serif" font-weight="900" font-style="italic" font-size="28" fill="#F3F3F5" text-anchor="middle" letter-spacing="2" class="svg-artist-text">MICHAEL JACKSON</text>
                    <text x="150" y="88" font-family="'Playfair Display', serif" font-weight="700" font-style="italic" font-size="22" fill="#E6A820" text-anchor="middle" letter-spacing="4" class="svg-album-text">THRILLER</text>
                  </svg>
                  <img id="custom-cover-img" style="display:none;" alt="Cover" />
                </div>

                <!-- Botón transmisor Jet Music con ondas -->
                <div class="mini-badge-btn">
                  <div class="pulse-ring"></div>
                  <div class="pulse-ring"></div>
                  <svg viewBox="0 0 512 512" width="24" height="24">
                    <g transform="translate(256, 256) scale(220)">
                      <circle cx="0" cy="0" r="0.64" fill="none" stroke="#D9232E" stroke-width="0.064"/>
                      <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#D9232E" stroke-width="0.084" stroke-linecap="round"/>
                      <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#D9232E" stroke="#D9232E" stroke-width="0.036"/>
                      <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#D9232E" stroke="#D9232E" stroke-width="0.030"/>
                    </g>
                  </svg>
                </div>
              </div>

              <div class="mini-info-row">
                <div class="song-title-display mini-title" id="display-title-1">Billie Jean</div>
                <div class="artist-name-display mini-artist" id="display-artist-1">Michael Jackson</div>
              </div>

              <div class="mini-controls-row">
                <button class="ctrl-btn" title="Anterior">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                  </svg>
                </button>
                <button class="ctrl-btn play-pause-circle" id="mini-pause-btn" title="Reproducir / Pausa">
                  <div class="click-ripple" id="mini-click-ripple"></div>
                  <svg id="mini-pause-icon" viewBox="0 0 24 24" width="22" height="22">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                  </svg>
                </button>
                <button class="ctrl-btn" title="Siguiente">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                  </svg>
                </button>
              </div>

            </div>

            <!-- CONTENIDO ESCENA 4: EXPANDIDO "MUSIC FLOW" -->
            <div id="flow-content">
              <canvas id="flow-canvas-bg" width="720" height="420"></canvas>
              <video id="custom-video-flow" loop muted playsinline></video>
              
              <div class="flow-gradient-overlay"></div>

              <div class="flow-top-bar">
                <div class="flow-brand-tag">
                  <span class="tag-dot"></span>
                  <span>EN VIVO</span>
                </div>
                <div class="flow-badge-pill">
                  <svg viewBox="0 0 512 512">
                    <g transform="translate(256, 256) scale(220)">
                      <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#FFFFFF"/>
                      <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#FFFFFF"/>
                    </g>
                  </svg>
                  <span>Jet Music Flow</span>
                </div>
              </div>

              <div class="flow-bottom-section">
                <div class="flow-meta">
                  <div>
                    <div class="song-title-display flow-song-title" id="display-title-2">Billie Jean</div>
                    <div class="artist-name-display flow-artist-title" id="display-artist-2">Michael Jackson — Thriller</div>
                  </div>
                </div>

                <div class="flow-progress-container">
                  <div class="flow-progress-track">
                    <div class="flow-progress-fill" id="flow-progress-bar"></div>
                  </div>
                  <div class="flow-time-row">
                    <span id="flow-cur-time">1:32</span>
                    <span id="flow-remain-time">-3:22</span>
                  </div>
                </div>
              </div>

            </div>

          </div>
        </div>

        <!-- ========================================================
             ESCENA 5: TARJETA 3D DE LETRAS SINCRONIZADAS ("LYRICS")
             ======================================================== -->
        <div id="lyrics-card">
          <div class="lyrics-top-row">
            <div class="lyrics-label">Lyrics</div>
            <div class="lyrics-capsule">
              <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
              <svg viewBox="0 0 512 512" width="22" height="22">
                <g transform="translate(256, 256) scale(230)">
                  <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#FFFFFF" stroke-width="0.084" stroke-linecap="round"/>
                  <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#FFFFFF"/>
                  <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#FFFFFF"/>
                </g>
              </svg>
            </div>
          </div>

          <div class="lyrics-word-center">
            <div class="lyric-girl-word" id="lyric-word-girl">girl</div>
          </div>

          <div style="height: 20px;"></div>
        </div>

        <!-- ========================================================
             ESCENA 6: TIPOGRAFÍA CINÉTICA A PANTALLA COMPLETA
             ======================================================== -->
        <div id="kinetic-container">
          <video id="kinetic-video-bg" loop muted playsinline></video>
          
          <div class="kinetic-lines-box">
            <div class="kinetic-line kinetic-line-1" id="k-line-1">WHO CLAIMS</div>
            <div class="kinetic-line kinetic-line-2" id="k-line-2">
              <span>THAT I</span>
              <span id="k-line-am" style="opacity: 0; transform: translateX(20px); display: inline-block;">AM</span>
            </div>
            <div class="kinetic-line kinetic-line-3" id="k-line-3">
              <span>THE</span>
              <span class="kinetic-one-serif" id="k-word-one">one</span>
            </div>
          </div>
        </div>

        <!-- ========================================================
             ESCENA 7: BURBUJA POP "OH BABY"
             ======================================================== -->
        <div id="speech-bubble-scene">
          <div class="bubble-wrapper" id="speech-bubble-box">
            <div class="pop-bubble">
              Oh baby
              <div class="bubble-tail"></div>
            </div>
          </div>
        </div>

        <!-- ========================================================
             ESCENA 8: CARÁTULA A WIDGET FINAL (LOOP CERRADO)
             ======================================================== -->
        <div id="final-loop-container">
          <div id="hero-album-cover">
            <svg viewBox="0 0 300 300" width="100%" height="100%" class="final-cover-svg">
              <rect width="300" height="300" fill="#1B1C22"/>
              <path d="M40 290 Q 70 210, 130 190 Q 150 185, 175 190 Q 240 210, 260 290 Z" fill="#FFFFFF" opacity="0.95"/>
              <path d="M130 190 L 150 250 L 175 190 Z" fill="#141418"/>
              <circle cx="152" cy="140" r="34" fill="#694838"/>
              <circle cx="152" cy="132" r="38" fill="#0A0A0C"/>
              <text x="150" y="58" font-family="'Playfair Display', serif" font-weight="900" font-style="italic" font-size="28" fill="#F3F3F5" text-anchor="middle" letter-spacing="2" class="svg-artist-text">MICHAEL JACKSON</text>
              <text x="150" y="88" font-family="'Playfair Display', serif" font-weight="700" font-style="italic" font-size="22" fill="#E6A820" text-anchor="middle" letter-spacing="4" class="svg-album-text">THRILLER</text>
            </svg>
            <img class="final-custom-cover-img" style="display:none;" alt="Cover" />
          </div>

          <div id="loop-widget-card">
            <div id="loop-mini-content" style="position: absolute; inset: 0; padding: 26px; display: flex; flex-direction: column; justify-content: space-between;">
              <div class="mini-top-row">
                <div style="width: 92px; height: 92px; border-radius: 18px;"></div>
                <div class="mini-badge-btn">
                  <div class="pulse-ring"></div>
                  <svg viewBox="0 0 512 512" width="24" height="24">
                    <g transform="translate(256, 256) scale(220)">
                      <circle cx="0" cy="0" r="0.64" fill="none" stroke="#D9232E" stroke-width="0.064"/>
                      <line x1="-0.44" y1="-0.22" x2="-0.44" y2="0.22" stroke="#D9232E" stroke-width="0.084" stroke-linecap="round"/>
                      <polygon points="-0.34,-0.38 0.44,-0.02 -0.14,0.04" fill="#D9232E" stroke="#D9232E" stroke-width="0.036"/>
                      <polygon points="-0.14,0.11 0.44,0.02 -0.34,0.38" fill="#D9232E" stroke="#D9232E" stroke-width="0.030"/>
                    </g>
                  </svg>
                </div>
              </div>

              <div class="mini-info-row" style="margin-top: 14px;">
                <div class="song-title-display mini-title" id="display-title-3">Billie Jean</div>
                <div class="artist-name-display mini-artist" id="display-artist-3">Michael Jackson</div>
              </div>

              <div class="mini-controls-row">
                <button class="ctrl-btn">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                  </svg>
                </button>
                <button class="ctrl-btn play-pause-circle">
                  <svg viewBox="0 0 24 24" width="22" height="22">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                  </svg>
                </button>
                <button class="ctrl-btn">
                  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Banner flotante de grabación activa -->
    <div id="recorder-banner">
      <span class="record-indicator-dot"></span>
      <span id="record-status-label">Grabando 60 FPS con Audio...</span>
      <span id="record-percentage" style="color: var(--jet-red); font-variant-numeric: tabular-nums;">0%</span>
      <button class="action-btn" id="btn-cancel-record" style="padding: 4px 10px; font-size: 11px;">Cancelar</button>

    <!-- Botón flotante para restaurar/ocultar UI (Tecla H) -->

      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>

    <!-- ========================================================
         BARRA FLOTANTE DE CONTROL Y PERSONALIZACIÓN DE ESTUDIO

    <div id="studio-controls">
      
      <!-- Drawer de Personalización de Canción, Artista y Videos -->
      <div id="customizer-drawer">
        <div class="input-field-group">
          <span class="input-label">Título:</span>
          <input type="text" id="input-song-title" class="studio-input" value="Billie Jean" placeholder="Canción" />

          <span class="input-label">Artista:</span>
          <input type="text" id="input-artist-name" class="studio-input" value="Michael Jackson" placeholder="Artista" />

        <div class="input-field-group">
          <span class="input-label">Álbum:</span>
          <input type="text" id="input-album-name" class="studio-input" value="Thriller" placeholder="Álbum" />
        </div>

        <!-- Subida de Audio MP3 -->
        <label class="action-btn" title="Cargar pista oficial de audio (MP3, WAV, M4A)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <span id="label-audio-file">Subir MP3</span>
          <input type="file" id="input-custom-audio" class="hidden-file-input" accept="audio/*" />
        </label>

        <!-- Subida de Video de Fondo (Escenas 4 y 6) -->
