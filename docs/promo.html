  <audio id="custom-audio-player" preload="auto"></audio>

  <!-- ========================================================
       ARQUITECTURA DE CONTROL Y ANIMACIÓN
       ======================================================== -->
  <script>
    /* ==========================================================
       1. ESCALADOR DINÁMICO 1920x1080 (16:9 FIJO)
       ========================================================== */
    const scaler = document.getElementById('stage-scaler');
    function resizeStage() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const scale = Math.min(winW / 1920, winH / 1080);
      scaler.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    /* ==========================================================
       2. GENERACIÓN DE BALDOSAS 3D (ESCENA 1)
       ========================================================== */
    const floorGrid = document.getElementById('floor-grid');
    const totalTiles = 49;
    const centerTileIndex = 24;
    const adjacentTileIndex = 32;

    for (let i = 0; i < totalTiles; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.index = i;
      if (i === centerTileIndex) tile.id = 'tile-center';
      if (i === adjacentTileIndex) tile.id = 'tile-adjacent';
      floorGrid.appendChild(tile);
    }

    const centerTile = document.getElementById('tile-center');
    const adjacentTile = document.getElementById('tile-adjacent');
    const floorContainer = document.getElementById('scene-1-floor');
    const floorAmbientGlow = document.getElementById('floor-ambient-glow');

    /* ==========================================================
       3. LIENZO GENERATIVO DE CONCIERTO PARA ESCENA 4
       ========================================================== */
    const flowCanvas = document.getElementById('flow-canvas-bg');
    const ctxFlow = flowCanvas.getContext('2d');
    let flowAnimId;
    let flowParticles = [];
    for (let p = 0; p < 50; p++) {
      flowParticles.push({
        x: Math.random() * 720,
        y: Math.random() * 420,
        r: Math.random() * 3 + 1,
        vx: (Math.random() - 0.5) * 0.8,
        vy: -Math.random() * 1.5 - 0.5,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    function renderConcertFlow(time) {
      ctxFlow.clearRect(0, 0, 720, 420);

      const grad = ctxFlow.createLinearGradient(0, 0, 720, 420);
      grad.addColorStop(0, '#1E0E14');
      grad.addColorStop(0.5, '#2D1016');
      grad.addColorStop(1, '#0C0C10');
      ctxFlow.fillStyle = grad;
      ctxFlow.fillRect(0, 0, 720, 420);

      const t = time * 0.002;
      const spot1X = 360 + Math.sin(t) * 220;
      const spot2X = 360 - Math.cos(t * 1.2) * 200;

      const gradSpot1 = ctxFlow.createRadialGradient(spot1X, 80, 20, spot1X, 220, 320);
      gradSpot1.addColorStop(0, 'rgba(217, 35, 46, 0.45)');
      gradSpot1.addColorStop(1, 'transparent');
      ctxFlow.fillStyle = gradSpot1;
      ctxFlow.beginPath();
      ctxFlow.arc(spot1X, 200, 320, 0, Math.PI * 2);
      ctxFlow.fill();

      const gradSpot2 = ctxFlow.createRadialGradient(spot2X, 60, 20, spot2X, 200, 280);
      gradSpot2.addColorStop(0, 'rgba(255, 102, 178, 0.35)');
      gradSpot2.addColorStop(1, 'transparent');
      ctxFlow.fillStyle = gradSpot2;
      ctxFlow.beginPath();
      ctxFlow.arc(spot2X, 180, 280, 0, Math.PI * 2);
      ctxFlow.fill();

      ctxFlow.save();
      ctxFlow.globalCompositeOperation = 'lighter';
      for (let b = -2; b <= 2; b++) {
        const beamAngle = Math.sin(t + b * 0.8) * 0.35 + (b * 0.15);
        ctxFlow.save();
        ctxFlow.translate(360, -20);
        ctxFlow.rotate(beamAngle);
        const beamGrad = ctxFlow.createLinearGradient(0, 0, 0, 440);
        beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
        beamGrad.addColorStop(0.4, 'rgba(217, 35, 46, 0.15)');
        beamGrad.addColorStop(1, 'transparent');
        ctxFlow.fillStyle = beamGrad;
        ctxFlow.beginPath();
        ctxFlow.moveTo(-20, 0);
        ctxFlow.lineTo(20, 0);
        ctxFlow.lineTo(90, 440);
        ctxFlow.lineTo(-90, 440);
        ctxFlow.closePath();
        ctxFlow.fill();
        ctxFlow.restore();
      }
      ctxFlow.restore();

      ctxFlow.fillStyle = '#FFFFFF';
      flowParticles.forEach(pt => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        if (pt.y < 0) { pt.y = 420; pt.x = Math.random() * 720; }
        if (pt.x < 0) pt.x = 720;
        if (pt.x > 720) pt.x = 0;
        ctxFlow.globalAlpha = pt.alpha * 0.5;
        ctxFlow.beginPath();
        ctxFlow.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctxFlow.fill();
      });
      ctxFlow.globalAlpha = 1.0;

      ctxFlow.fillStyle = 'rgba(8, 8, 12, 0.75)';
      ctxFlow.beginPath();
      ctxFlow.moveTo(0, 420);
      for (let x = 0; x <= 720; x += 15) {
        const bump = Math.sin(x * 0.08) * 12 + Math.cos(x * 0.03) * 8;
        ctxFlow.lineTo(x, 380 + bump);
      }
      ctxFlow.lineTo(720, 420);
      ctxFlow.closePath();
      ctxFlow.fill();
    }

    function animateFlowLoop(ts) {
      renderConcertFlow(ts);
      flowAnimId = requestAnimationFrame(animateFlowLoop);
    }
    flowAnimId = requestAnimationFrame(animateFlowLoop);

    /* ==========================================================
       4. SINTETIZADOR WEB AUDIO BILLIE JEAN DE ALTA PRECISIÓN
       ========================================================== */
    class BillieJeanAudioEngine {
      constructor() {
        this.ctx = null;
        this.bpm = 117;
        this.isPlaying = false;
        this.isMuted = false;
        this.customAudio = document.getElementById('custom-audio-player');
        this.hasCustomAudio = false;
        this.gainMaster = null;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.gainMaster = this.ctx.createGain();
        this.gainMaster.gain.value = 0.8;
        this.gainMaster.connect(this.ctx.destination);
      }

      playKick(t) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.gainMaster);
        osc.frequency.setValueAtTime(125, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.16);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.start(t);
        osc.stop(t + 0.22);
      }

      playSnare(t) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gainOsc = this.ctx.createGain();
        osc.connect(gainOsc);
        gainOsc.connect(this.gainMaster);
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.12);
        gainOsc.gain.setValueAtTime(0.7, t);
        gainOsc.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
        osc.start(t);
        osc.stop(t + 0.14);

        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1200;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.6, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.gainMaster);
        noise.start(t);
        noise.stop(t + 0.18);
      }

      playHiHat(t, isAccent) {
        if (!this.ctx || this.isMuted) return;
        const bufferSize = this.ctx.sampleRate * 0.05;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 9500;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(isAccent ? 0.35 : 0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + (isAccent ? 0.06 : 0.035));
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.gainMaster);
        noise.start(t);
        noise.stop(t + 0.07);
      }

      playBassNote(freq, t, dur = 0.22) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const sub = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        sub.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        sub.frequency.setValueAtTime(freq / 2, t);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(650, t);
        filter.frequency.exponentialRampToValueAtTime(200, t + dur);

        gain.gain.setValueAtTime(0.55, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

        osc.connect(filter);
        sub.connect(filter);
        filter.connect(gain);
        gain.connect(this.gainMaster);

        osc.start(t);
        sub.start(t);
        osc.stop(t + dur);
        sub.stop(t + dur);
      }

      scheduleGroove(masterTl) {
        if (!this.ctx) this.init();
        const notes = [92.50, 138.59, 164.81, 185.00, 164.81, 138.59, 123.47, 138.59];
        const beatInterval = 60 / this.bpm;
        const totalDuration = 16.5;
        let time = 0.0;
        let noteIndex = 0;
        let stepCount = 0;

        while (time < totalDuration) {
          const t = time;
          const currentNote = notes[noteIndex % notes.length];
          const isQuarter = (stepCount % 2 === 0);
          const beatInBar = Math.floor(stepCount / 2) % 4;

          masterTl.call(() => {
            if (!this.isPlaying || this.isMuted || this.hasCustomAudio) return;
            const now = this.ctx ? this.ctx.currentTime : 0;
            if (isQuarter) {
              if (beatInBar === 0 || beatInBar === 2) this.playKick(now);
              else this.playSnare(now);
            }
            this.playHiHat(now, isQuarter);
            this.playBassNote(currentNote, now, 0.22);
          }, null, t);

          time += beatInterval / 2;
          noteIndex++;
          stepCount++;
        }
      }

      setPlaying(play) {
        this.isPlaying = play;
        if (this.ctx && this.ctx.state === 'suspended' && play) {
          this.ctx.resume();
        }
        if (this.hasCustomAudio) {
          if (play) this.customAudio.play();
          else this.customAudio.pause();
        }
      }

      seek(time) {
        if (this.hasCustomAudio) {
          this.customAudio.currentTime = time;
        }
      }
    }

    const audio = new BillieJeanAudioEngine();

    /* ==========================================================
       5. LÍNEA DE TIEMPO MAESTRA GSAP (EXACTA A 16.5s)
       ========================================================== */
    const widgetCard = document.getElementById('jet-card');
    const energyBurst = document.getElementById('energy-burst-circle');
    const miniWidgetContent = document.getElementById('mini-widget-content');
    const miniPauseBtn = document.getElementById('mini-pause-btn');
    const miniClickRipple = document.getElementById('mini-click-ripple');
    const flowContent = document.getElementById('flow-content');
    const flowProgressBar = document.getElementById('flow-progress-bar');
    const lyricsCard = document.getElementById('lyrics-card');
    const lyricWordGirl = document.getElementById('lyric-word-girl');
    const kineticContainer = document.getElementById('kinetic-container');
    const kLine1 = document.getElementById('k-line-1');
    const kLine2 = document.getElementById('k-line-2');
    const kLineAm = document.getElementById('k-line-am');
    const kLine3 = document.getElementById('k-line-3');
    const kWordOne = document.getElementById('k-word-one');
    const speechBubbleScene = document.getElementById('speech-bubble-scene');
    const speechBubbleBox = document.getElementById('speech-bubble-box');
    const finalLoopContainer = document.getElementById('final-loop-container');
    const heroAlbumCover = document.getElementById('hero-album-cover');
    const loopWidgetCard = document.getElementById('loop-widget-card');

    gsap.defaults({ ease: "power2.out" });

    const tl = gsap.timeline({
      paused: false,
      repeat: -1,
      onUpdate: updateScrubberUI,
      onRepeat: () => {
        audio.seek(0);
      }
    });

    audio.scheduleGroove(tl);

    /* ----------------------------------------------------------
       ESCENA 1 (0.0s – 2.0s): CUADRÍCULA 3D DE BALDOSAS ("BILLIE JEAN FLOOR")
       ---------------------------------------------------------- */
    tl.call(() => {
      centerTile.classList.remove('lit-center');
      adjacentTile.classList.remove('lit-adjacent');
    }, null, 0.0);

    tl.set(floorContainer, {
      opacity: 1,
      rotateX: 58,
      rotateZ: -18,
      scale: 1,
      z: 0
    }, 0.0);

    tl.set([energyBurst, widgetCard, lyricsCard, kineticContainer, speechBubbleScene, finalLoopContainer], {
      opacity: 0,
      pointerEvents: 'none'
    }, 0.0);

    tl.set(floorAmbientGlow, { opacity: 0 }, 0.0);

    // t = 0.2s: se enciende la baldosa central con brillo rosa (#FF66B2)
    tl.call(() => {
      centerTile.classList.add('lit-center');
    }, null, 0.2);

    tl.to(floorAmbientGlow, {
      opacity: 0.7,
      duration: 0.35,
      ease: "power1.out"
    }, 0.2);

    // t = 1.1s: se enciende la baldosa adyacente inferior derecha con zoom-in
    tl.call(() => {
      adjacentTile.classList.add('lit-adjacent');
    }, null, 1.1);

    tl.to(floorAmbientGlow, {
      opacity: 1.0,
      scale: 1.25,
      duration: 0.5,
      ease: "power2.out"
    }, 1.1);

    tl.to(floorContainer, {
      scale: 1.55,
      z: 280,
      rotateX: 52,
      rotateZ: -14,
      duration: 0.9,
      ease: "power3.inOut"
    }, 1.1);

    /* ----------------------------------------------------------
       ESCENA 2 (2.0s – 3.0s): REVELACIÓN DEL ICONO OFICIAL JET MUSIC
       ---------------------------------------------------------- */
    tl.to(floorContainer, {
      opacity: 0,
      scale: 2.1,
      duration: 0.35,
      ease: "power3.in"
    }, 2.0);

    tl.set(energyBurst, {
      opacity: 1,
      scale: 0.1,
      boxShadow: "0 0 120px #D9232E, 0 0 240px rgba(217, 35, 46, 0.85)"
    }, 2.0);

    tl.to(energyBurst, {
      scale: 1.0,
      duration: 0.65,
      ease: "elastic.out(1, 0.5)"
    }, 2.05);

    // Morphing hacia la tarjeta cuadrada redondeada
    tl.to(energyBurst, {
      scale: 1.35,
      opacity: 0,
      duration: 0.45,
      ease: "power2.in"
    }, 2.45);

    tl.set(widgetCard, {
      width: 340,
      height: 340,
      borderRadius: 44,
      scale: 0.7,
      opacity: 0,
      rotateY: 0,
      rotateX: 0
    }, 2.45);

    tl.to(widgetCard, {
      scale: 1.0,
      opacity: 1,
      duration: 0.55,
      ease: "back.out(1.8)"
    }, 2.5);

    /* ----------------------------------------------------------
       ESCENA 3 (3.0s – 4.2s): MINI-WIDGET DE REPRODUCCIÓN JET MUSIC
       ---------------------------------------------------------- */
    tl.set(miniWidgetContent, { opacity: 1 }, 2.9);
    tl.from("#mini-cover-box", {
      scale: 0.6,
      opacity: 0,
      duration: 0.45,
      ease: "back.out(2)"
    }, 3.0);

    tl.from(".mini-badge-btn", {
      scale: 0.4,
      opacity: 0,
      duration: 0.4,
      ease: "back.out(2)"
    }, 3.1);

    tl.from(".mini-info-row", {
      y: 18,
      opacity: 0,
      duration: 0.35,
      ease: "power2.out"
    }, 3.15);

    tl.from(".mini-controls-row .ctrl-btn", {
      scale: 0.5,
      opacity: 0,
      stagger: 0.08,
      duration: 0.35,
      ease: "back.out(2)"
    }, 3.2);

    // En t = 3.6s: Clic en el botón central de pausa
    tl.to(miniPauseBtn, {
      scale: 0.86,
      duration: 0.09,
      ease: "power2.in"
    }, 3.6);

    tl.to(miniClickRipple, {
      scale: 1.6,
      opacity: 0.7,
      duration: 0.09,
      ease: "power1.out"
    }, 3.6);

    tl.to(miniPauseBtn, {
      scale: 1.0,
      duration: 0.18,
      ease: "back.out(3)"
    }, 3.69);

    tl.to(miniClickRipple, {
      scale: 2.2,
      opacity: 0,
      duration: 0.22,
      ease: "power2.out"
    }, 3.69);

    /* ----------------------------------------------------------
       ESCENA 4 (4.2s – 6.2s): EXPANSIÓN A "MUSIC FLOW"
       ---------------------------------------------------------- */
    tl.to(miniWidgetContent, {
      opacity: 0,
      duration: 0.25,
      ease: "power2.in"
    }, 4.2);

    tl.to(widgetCard, {
      width: 720,
      height: 420,
      borderRadius: 36,
      rotateY: -18,
      rotateX: 8,
      scale: 1.35,
      duration: 0.85,
      ease: "power3.inOut"
    }, 4.2);

    tl.set(flowContent, { opacity: 0 }, 4.2);
    tl.to(flowContent, {
      opacity: 1,
      duration: 0.5,
      ease: "power2.out"
    }, 4.45);

    tl.fromTo(flowProgressBar, { width: "12%" }, {
      width: "58%",
      duration: 2.0,
      ease: "none"
    }, 4.2);

    tl.to(widgetCard, {
      rotateY: -12,
      rotateX: 4,
      duration: 1.15,
      ease: "sine.inOut"
    }, 5.05);

    /* ----------------------------------------------------------
       ESCENA 5 (6.2s – 8.4s): TARJETA 3D DE LETRAS SINCRONIZADAS ("LYRICS")
       ---------------------------------------------------------- */
    tl.to(widgetCard, {
      scale: 0.6,
      opacity: 0,
      filter: "blur(20px)",
      duration: 0.35,
      ease: "power3.in"
    }, 6.15);

    tl.set(lyricsCard, {
      opacity: 0,
      scale: 0.65,
      rotateY: -24,
      rotateX: 14,
      filter: "blur(14px)"
    }, 6.2);

    tl.to(lyricsCard, {
      opacity: 1,
      scale: 1.0,
      rotateY: -14,
      rotateX: 6,
      filter: "blur(0px)",
      duration: 0.6,
      ease: "power3.out"
    }, 6.25);

    // Explosión de "girl" en tipografía bold blanca 110px
    tl.set(lyricWordGirl, {
      opacity: 0,
      scale: 0.15
    }, 6.55);

    tl.to(lyricWordGirl, {
      opacity: 1,
      scale: 1.25,
      duration: 0.35,
      ease: "power2.out"
    }, 6.6);

    tl.call(() => {
      lyricWordGirl.classList.add('chromatic');
    }, null, 6.7);

    tl.to(lyricWordGirl, {
      scale: 1.0,
      duration: 0.45,
      ease: "elastic.out(1.1, 0.4)"
    }, 6.95);

    tl.call(() => {
      lyricWordGirl.classList.remove('chromatic');
    }, null, 7.3);

    tl.to(lyricsCard, {
      rotateY: -8,
      rotateX: 2,
      duration: 1.2,
      ease: "sine.inOut"
    }, 7.2);

    /* ----------------------------------------------------------
       ESCENA 6 (8.4s – 11.0s): TIPOGRAFÍA CINÉTICA A PANTALLA COMPLETA
       ---------------------------------------------------------- */
    tl.to(lyricsCard, {
      scale: 2.4,
      opacity: 0,
      duration: 0.45,
      ease: "power2.in"
    }, 8.35);

    tl.set(kineticContainer, { opacity: 1 }, 8.4);

    tl.to(kLine1, {
      opacity: 1,
      x: 0,
      duration: 0.32,
      ease: "power4.out"
    }, 8.45);

    tl.to(kLine2, {
      opacity: 1,
      x: 0,
      duration: 0.32,
      ease: "power4.out"
    }, 8.95);

    tl.to(kLineAm, {
      opacity: 1,
      x: 0,
      duration: 0.25,
      ease: "back.out(2)"
    }, 9.35);

    tl.to(kLine3, {
      opacity: 1,
      x: 0,
      duration: 0.32,
      ease: "power4.out"
    }, 9.7);

    // En t = 9.8s: Aparece "one" en tipografía cursiva rosa neón (#FF4D8D)
    tl.to(kWordOne, {
      opacity: 1,
      scale: 1.0,
      rotate: 0,
      duration: 0.55,
      ease: "elastic.out(1.2, 0.45)"
    }, 9.8);

    tl.to(kWordOne, {
      textShadow: "0 0 40px #FF4D8D, 0 0 90px #FF4D8D, 0 0 160px rgba(255, 77, 141, 0.9)",
      duration: 0.4,
      yoyo: true,
      repeat: 2,
      ease: "sine.inOut"
    }, 10.1);

    /* ----------------------------------------------------------
       ESCENA 7 (11.0s – 12.1s): BURBUJA POP "OH BABY"
       ---------------------------------------------------------- */
    tl.set(kineticContainer, { opacity: 0 }, 11.0);
    tl.set(speechBubbleScene, { opacity: 1 }, 11.0);

    tl.set(speechBubbleBox, {
      scale: 0.1,
      rotate: -12,
      opacity: 0
    }, 11.0);

    tl.to(speechBubbleBox, {
      scale: 1.0,
      rotate: -4,
      opacity: 1,
      duration: 0.45,
      ease: "back.out(2.4)"
    }, 11.05);

    tl.to(speechBubbleBox, {
      scaleX: 1.06,
      scaleY: 0.94,
      duration: 0.15,
      ease: "power1.out"
    }, 11.5);

    tl.to(speechBubbleBox, {
      scaleX: 1.0,
      scaleY: 1.0,
      duration: 0.25,
      ease: "elastic.out(1.5, 0.3)"
    }, 11.65);

    tl.to(speechBubbleBox, {
      scale: 0,
      opacity: 0,
      duration: 0.18,
      ease: "power3.in"
    }, 12.0);

    /* ----------------------------------------------------------
       ESCENA 8 (12.1s – 16.5s): PORTADA A WIDGET FINAL DE JET MUSIC (LOOP)
       ---------------------------------------------------------- */
    tl.set(speechBubbleScene, { opacity: 0 }, 12.1);
    tl.set(finalLoopContainer, { opacity: 1 }, 12.1);

    // Carátula completa en el centro (460px x 460px)
    tl.set(heroAlbumCover, {
      width: 460,
      height: 460,
      borderRadius: 28,
      top: "50%",
      left: "50%",
      x: 0,
      y: 0,
      xPercent: -50,
      yPercent: -50,
      scale: 0.5,
      opacity: 0,
      rotateY: -8,
      rotateX: 4
    }, 12.1);

    tl.to(heroAlbumCover, {
      scale: 1.0,
      opacity: 1,
      rotateY: 0,
      rotateX: 0,
      duration: 0.7,
      ease: "back.out(1.6)"
    }, 12.15);

    tl.to(heroAlbumCover, {
      yPercent: -53,
      rotateY: 4,
      duration: 1.6,
      ease: "sine.inOut"
    }, 12.2);

    // En t = 13.8s: La carátula se encoge al slot (92px x 92px)
    tl.set(loopWidgetCard, {
      width: 340,
      height: 340,
      borderRadius: 44,
      scale: 0.8,
      opacity: 0
    }, 13.8);

    tl.to(loopWidgetCard, {
      scale: 1.0,
      opacity: 1,
      duration: 0.75,
      ease: "power3.out"
    }, 13.8);

    tl.to(heroAlbumCover, {
      width: 92,
      height: 92,
      borderRadius: 18,
      x: -98,
      y: -98,
      xPercent: -50,
      yPercent: -50,
      rotateY: 0,
      rotateX: 0,
      duration: 0.75,
      ease: "power3.inOut"
    }, 13.8);

    tl.to({}, { duration: 1.95 }, 14.55);

    /* ==========================================================
       6. CONTROLES INTERACTIVOS, ATAJOS Y PERSONALIZACIÓN DINÁMICA
       ========================================================== */
    const playBtn = document.getElementById('btn-play-pause');
    const playBtnText = document.getElementById('play-btn-text');
    const scrubber = document.getElementById('timeline-scrubber');
    const curTimeLabel = document.getElementById('time-current');
    const scenePills = document.querySelectorAll('.scene-pill');
    const speedBtn = document.getElementById('btn-speed');
    const loopBtn = document.getElementById('btn-loop-toggle');
    const audioBtn = document.getElementById('btn-audio-toggle');
    const audioBtnLabel = document.getElementById('audio-btn-label');
    const cleanFullscreenBtn = document.getElementById('btn-clean-fullscreen');
    const recordBtn = document.getElementById('btn-record-video');
    const uiToggleBtn = document.getElementById('ui-toggle-float');
    const studioControls = document.getElementById('studio-controls');

    // Inputs de personalización de canción y artista
    const inputSongTitle = document.getElementById('input-song-title');
    const inputArtistName = document.getElementById('input-artist-name');
    const inputAlbumName = document.getElementById('input-album-name');

    const displayTitles = [
      document.getElementById('display-title-1'),
      document.getElementById('display-title-2'),
      document.getElementById('display-title-3')
    ];
    const displayArtists = [
      document.getElementById('display-artist-1'),
      document.getElementById('display-artist-2'),
      document.getElementById('display-artist-3')
    ];
    const svgArtistTexts = document.querySelectorAll('.svg-artist-text');
    const svgAlbumTexts = document.querySelectorAll('.svg-album-text');

    function updateTrackMetadata() {
      const title = inputSongTitle.value.trim() || "Billie Jean";
      const artist = inputArtistName.value.trim() || "Michael Jackson";
      const album = inputAlbumName.value.trim() || "Thriller";

      displayTitles.forEach(el => { if (el) el.textContent = title; });
      displayArtists.forEach((el, idx) => {
        if (el) {
          if (idx === 1) el.textContent = `${artist} — ${album}`;
          else el.textContent = artist;
        }
      });
      svgArtistTexts.forEach(el => { if (el) el.textContent = artist.toUpperCase(); });
      svgAlbumTexts.forEach(el => { if (el) el.textContent = album.toUpperCase(); });
    }

    inputSongTitle.addEventListener('input', updateTrackMetadata);
    inputArtistName.addEventListener('input', updateTrackMetadata);
    inputAlbumName.addEventListener('input', updateTrackMetadata);

    // Play / Pause
    function togglePlayPause() {
      if (tl.paused()) {
        tl.play();
        audio.setPlaying(true);
        playBtnText.textContent = "Pausar";
        playBtn.classList.add('primary');
      } else {
        tl.pause();
        audio.setPlaying(false);
        playBtnText.textContent = "Play";
        playBtn.classList.remove('primary');
      }
    }
    playBtn.addEventListener('click', () => {
      audio.init();
      togglePlayPause();
    });

    // Tecla 'H' para alternar barra flotante y Espacio para Play/Pause
    function toggleControlsUI() {
      studioControls.classList.toggle('hidden-ui');
    }
    uiToggleBtn.addEventListener('click', toggleControlsUI);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        audio.init();
        togglePlayPause();
      } else if (e.code === 'KeyH') {
        toggleControlsUI();
      }
    });

    // Scrubber
    let isUserScrubbing = false;
    scrubber.addEventListener('input', () => {
      isUserScrubbing = true;
      const targetTime = parseFloat(scrubber.value);
      tl.pause();
      tl.time(targetTime);
      audio.seek(targetTime);
      formatTime(targetTime);
      updateScenePills(targetTime);
    });

    scrubber.addEventListener('change', () => {
      isUserScrubbing = false;
      if (playBtnText.textContent === "Pausar") {
        tl.play();
        audio.setPlaying(true);
      }
    });

    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      curTimeLabel.textContent = `${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function updateScrubberUI() {
      if (isUserScrubbing) return;
      const t = tl.time();
      scrubber.value = t;
      formatTime(t);
      updateScenePills(t);
    }

    function updateScenePills(t) {
      scenePills.forEach(pill => {
        const pTime = parseFloat(pill.dataset.time);
        if (t >= pTime && t < pTime + 2.0) {
          pill.classList.add('current');
        } else {
          pill.classList.remove('current');
        }
      });
    }

    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        const timeTarget = parseFloat(pill.dataset.time);
        tl.time(timeTarget);
        audio.seek(timeTarget);
        audio.init();
        if (tl.paused()) {
          tl.play();
          audio.setPlaying(true);
          playBtnText.textContent = "Pausar";
          playBtn.classList.add('primary');
        }
      });
    });

    // Velocidades
    const speeds = [1.0, 1.5, 2.0, 0.25, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      const currentSpeed = speeds[speedIdx];
      tl.timeScale(currentSpeed);
      speedBtn.textContent = `${currentSpeed}x`;
    });

    // Loop
    let isLoopEnabled = true;
    loopBtn.addEventListener('click', () => {
      isLoopEnabled = !isLoopEnabled;
      tl.repeat(isLoopEnabled ? -1 : 0);
      loopBtn.classList.toggle('active', isLoopEnabled);
    });

    // Audio
    let isAudioOn = true;
    audioBtn.addEventListener('click', () => {
      audio.init();
      isAudioOn = !isAudioOn;
      audio.isMuted = !isAudioOn;
      audioBtn.classList.toggle('active', isAudioOn);
      audioBtnLabel.textContent = isAudioOn ? "Audio ON" : "Mute";
    });

    /* ==========================================================
       7. BOTÓN: REPRODUCIR EN PANTALLA COMPLETA (SIN UI)
       ========================================================== */
    cleanFullscreenBtn.addEventListener('click', async () => {
      audio.init();
      studioControls.classList.add('hidden-ui');
      
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
        console.warn("Fullscreen request error:", e);
      }

      // Reiniciar a tiempo 0 y reproducir
      tl.time(0);
      audio.seek(0);
      tl.play();
      audio.setPlaying(true);
      playBtnText.textContent = "Pausar";
      playBtn.classList.add('primary');
    });

    /* ==========================================================
       8. CARGA DE ARCHIVOS PERSONALIZADOS (AUDIO, VIDEO, COVER)
       ========================================================== */
    const customAudioInput = document.getElementById('input-custom-audio');
    const customAudioPlayer = document.getElementById('custom-audio-player');
    const labelAudioFile = document.getElementById('label-audio-file');

    customAudioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        customAudioPlayer.src = url;
        audio.hasCustomAudio = true;
        audio.init();
        audio.seek(tl.time());
        if (!tl.paused()) customAudioPlayer.play();
        labelAudioFile.textContent = "Audio: OK";
      }
    });

    const customVideoInput = document.getElementById('input-custom-video');
    const customVideoFlow = document.getElementById('custom-video-flow');
    const kineticVideoBg = document.getElementById('kinetic-video-bg');
    const flowCanvasBg = document.getElementById('flow-canvas-bg');
    const labelVideoFile = document.getElementById('label-video-file');

    customVideoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        
        // Asignar a Escena 4 (Music Flow)
        customVideoFlow.src = url;
        customVideoFlow.style.display = 'block';
        flowCanvasBg.style.display = 'none';
        customVideoFlow.play();

        // Asignar también a Escena 6 (Cinética)
        kineticVideoBg.src = url;
        kineticVideoBg.style.display = 'block';
        kineticVideoBg.play();

        labelVideoFile.textContent = "Video: OK";
      }
    });

    const customCoverInput = document.getElementById('input-custom-cover');
    const customCoverImg = document.getElementById('custom-cover-img');
    const defaultCoverSvg = document.getElementById('default-cover-svg');
    const finalCoverSvg = document.querySelector('.final-cover-svg');
    const finalCustomCoverImg = document.querySelector('.final-custom-cover-img');

    customCoverInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        customCoverImg.src = url;
        customCoverImg.style.display = 'block';
        defaultCoverSvg.style.display = 'none';

        finalCustomCoverImg.src = url;
        finalCustomCoverImg.style.display = 'block';
        finalCoverSvg.style.display = 'none';
      }
    });

    /* ==========================================================
       9. BOTÓN: EXPORTAR / GRABAR VIDEO (60 FPS)
       ========================================================== */
    const recordBanner = document.getElementById('recorder-banner');
    const recordPercentage = document.getElementById('record-percentage');
    const recordCancelBtn = document.getElementById('btn-cancel-record');
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    recordBtn.addEventListener('click', async () => {
      if (isRecording) return;
      audio.init();
      startVideoRecording();
    });

    recordCancelBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recordBanner.style.display = 'none';
      studioControls.classList.remove('hidden-ui');
      tl.play();
    });

    async function startVideoRecording() {
      try {
        isRecording = true;
        recordedChunks = [];
        recordBanner.style.display = 'flex';
        recordPercentage.textContent = "0%";

        // Ocultar barra flotante durante la grabación
        studioControls.classList.add('hidden-ui');

        // Captura de pantalla/pestaña nativa a 60 FPS o fallback de Canvas
        let stream;
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: {
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 60 }
              },
              audio: true
            });
          }
        } catch (displayErr) {
          console.warn("getDisplayMedia cancelado o no soportado, usando captura alternativa:", displayErr);
        }

        // Si no se capturó stream de displayMedia, crear canvas stream de 60 FPS
        if (!stream) {
          const captureCanvas = document.createElement('canvas');
          captureCanvas.width = 1920;
          captureCanvas.height = 1080;
          stream = captureCanvas.captureStream(60);
        }

        // Conectar audio sincronizado al stream
        if (audio.ctx && audio.gainMaster) {
          const dest = audio.ctx.createMediaStreamDestination();
          audio.gainMaster.connect(dest);
          dest.stream.getAudioTracks().forEach(track => stream.addTrack(track));
        }

        // Selección de códec óptimo
        let mimeType = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'video/webm;codecs=vp8,opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm';
          }
        }

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: mimeType,
          videoBitsPerSecond: 18000000
        });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          isRecording = false;
          recordBanner.style.display = 'none';
          studioControls.classList.remove('hidden-ui');

          // Detener pistas del stream
          stream.getTracks().forEach(track => track.stop());

          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const songName = (inputSongTitle.value.trim() || 'jet-music-promo').toLowerCase().replace(/\s+/g, '-');
            a.download = `${songName}-promo-60fps-${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          }
        };

        // Reiniciar timeline a 0
        tl.pause();
        tl.time(0);
        audio.seek(0);

        mediaRecorder.start();

        tl.play();
        audio.setPlaying(true);

        const totalDuration = 16.5;
        const progressInterval = setInterval(() => {
          if (!isRecording) {
            clearInterval(progressInterval);
            return;
          }
          const cur = tl.time();
          const percent = Math.min(100, Math.floor((cur / totalDuration) * 100));
          recordPercentage.textContent = `${percent}%`;

          if (cur >= totalDuration - 0.05) {
            clearInterval(progressInterval);
            mediaRecorder.stop();
            tl.pause();
            audio.setPlaying(false);
          }
        }, 100);

      } catch (err) {
        console.error("Error al iniciar grabación:", err);
        alert("Aviso de grabación: " + err.message);
        recordBanner.style.display = 'none';
        studioControls.classList.remove('hidden-ui');
        isRecording = false;
      }
    }

    // Inicializar audio al primer toque en la pantalla
    window.addEventListener('pointerdown', () => {
      audio.init();
    }, { once: true });

  </script>
</body>
</html>
